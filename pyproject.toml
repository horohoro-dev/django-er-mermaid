[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-er-mermaid"
version = "0.1.0"
description = "Generate Mermaid ER diagrams and data dictionaries from Django models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "horohoro-dev" }
]
keywords = [
    "django",
    "er-diagram",
    "erd",
    "mermaid",
    "database",
    "documentation",
    "schema",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Documentation",
]
dependencies = [
    "django>=5.0",
]

[project.optional-dependencies]
dev = [
    "djangorestframework>=3.15",
    "pillow>=12.1.1",
    "ruff>=0.14.8",
]

[project.urls]
Homepage = "https://github.com/horohoro-dev/django-er-mermaid"
Repository = "https://github.com/horohoro-dev/django-er-mermaid"

[tool.hatch.build.targets.wheel]
packages = ["django_er_mermaid"]

[tool.pyright]
typeCheckingMode = "off"
